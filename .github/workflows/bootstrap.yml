name: Prototype bootstrap

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Existing prototype branch to use for the release PR
        required: true
        default: prototype/wayfinder-357
        type: string
      version:
        description: Stable SemVer version to place in VERSION
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Create or advance the automation release branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ inputs.source_ref }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version must be stable SemVer" >&2
            exit 1
          fi

          git check-ref-format "refs/heads/$SOURCE_REF"
          source_advanced=false
          if git ls-remote --exit-code origin refs/heads/release/bot >/dev/null 2>&1; then
            git fetch origin release/bot
            git checkout -B release/bot FETCH_HEAD
            git fetch origin "refs/heads/$SOURCE_REF"
            source_sha=$(git rev-parse FETCH_HEAD)
            current_sha=$(git rev-parse HEAD)
            if [ "$source_sha" != "$current_sha" ]; then
              if git merge-base --is-ancestor "$current_sha" "$source_sha"; then
                git merge --ff-only "$source_sha"
                source_advanced=true
              elif ! git merge-base --is-ancestor "$source_sha" "$current_sha"; then
                echo "source ref is not a fast-forward of release/bot" >&2
                exit 1
              fi
            fi
          else
            git fetch origin "refs/heads/$SOURCE_REF"
            git checkout -b release/bot FETCH_HEAD
            source_advanced=true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$VERSION" > VERSION
          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v$VERSION"
          elif [ "$source_advanced" = true ]; then
            git commit --allow-empty -m "chore(release): refresh v$VERSION"
          fi
          git push origin release/bot

          number=$(gh pr list --repo "$REPOSITORY" --head release/bot --base main --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh pr create --repo "$REPOSITORY" --base main --head release/bot \
              --title "Release v$VERSION" \
              --body "Automation-authored release PR for the isolated issue 357 proof."
          else
            gh pr edit "$number" --repo "$REPOSITORY" --title "Release v$VERSION"
          fi
